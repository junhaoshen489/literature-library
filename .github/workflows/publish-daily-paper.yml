name: Publish dispatched daily paper

on:
  repository_dispatch:
    types: [publish-daily-paper]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append the dispatched paper
        env:
          DAILY_PAPER_JSON: ${{ toJson(github.event.client_payload.paper) }}
        run: node scripts/append-daily-paper.mjs
      - run: node scripts/validate-daily-papers.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-papers.json
          git commit -m "Add daily paper: ${{ github.event.client_payload.paper.id }}"
          git push
