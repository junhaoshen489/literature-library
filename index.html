<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人科研文献库</title><style>body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:960px;margin:auto;padding:32px;background:#f7f8fc;color:#182034}h1{margin-bottom:4px}.lead{color:#667085}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #d0d5dd;border-radius:8px}input,textarea{width:100%;box-sizing:border-box}button{background:#185adb;color:#fff;border:0;cursor:pointer}.toolbar{display:grid;grid-template-columns:1fr 140px;gap:12px;margin:24px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 1px 3px #0000000d}.meta{color:#667085;font-size:.92rem}.tag{display:inline-block;background:#eef4ff;color:#1849a9;padding:3px 8px;border-radius:99px;margin:8px 5px 0 0;font-size:.8rem}dialog{max-width:650px;border:0;border-radius:14px;padding:24px}dialog::backdrop{background:#10182880}label{display:block;margin:12px 0 4px}small{color:#667085}footer{margin-top:32px;color:#667085;font-size:.9rem}</style></head><body>
<h1>个人科研文献库</h1><p class="lead">公开保存年份、题目和研究概述；PDF 全文仅存入私有 GitHub 仓库。</p>
<div class="toolbar"><input id="q" placeholder="检索标题、作者、关键词或概述"><select id="year"><option value="">全部年份</option></select></div><div id="count" class="meta"></div><main id="list"></main>
<dialog id="add"><h2>新增文献条目</h2><p><small>此页面公开保存书目信息与概述。PDF 请仅上传到私有仓库 literature-pdfs-private；不要在这里粘贴全文或私人令牌。</small></p><label>标题 *</label><input id="title"><label>年份 *</label><input id="y" type="number" min="1900" max="2100"><label>期刊 / 来源</label><input id="journal"><label>作者</label><input id="authors"><label>DOI 或链接</label><input id="doi"><label>基本内容概述 *</label><textarea id="summary" rows="5"></textarea><label>关键词（以逗号分隔）</label><input id="tags"><p><button id="save">保存到本浏览器</button> <button onclick="add.close()" type="button">取消</button></p><small>说明：网页端暂存仅在当前浏览器有效。长期归档请通过本对话上传论文，由助手写入 GitHub；GitHub 连接授权完成后将实现自动同步。</small></dialog>
<p><button onclick="add.showModal()">新增阅读记录</button> <button id="export">导出 JSON</button></p><footer>公开目录仓库：<a href="https://github.com/junhaoshen489/literature-library">literature-library</a> · PDF 私有仓库：literature-pdfs-private</footer>
<script>const seed=[];let papers=JSON.parse(localStorage.getItem('literature-papers')||'null')||seed;const q=document.querySelector('#q'),ys=document.querySelector('#year'),list=document.querySelector('#list');function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function render(){let years=[...new Set(papers.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a);ys.innerHTML='<option value="">全部年份</option>'+years.map(y=>'<option>'+y+'</option>').join('');let term=q.value.toLowerCase(),year=ys.value;let rows=papers.filter(p=>(!year||p.year==year)&&JSON.stringify(p).toLowerCase().includes(term)).sort((a,b)=>b.year-a.year);document.querySelector('#count').textContent='找到 '+rows.length+' 篇文献';list.innerHTML=rows.length?rows.map(p=>'<article class="card"><h2>'+esc(p.title)+'</h2><div class="meta">'+esc(p.year)+' · '+esc(p.journal)+' · '+esc(p.authors)+'</div><p>'+esc(p.summary)+'</p>'+(p.doi?'<a target="_blank" rel="noreferrer" href="'+esc(p.doi.startsWith('http')?p.doi:'https://doi.org/'+p.doi)+'">查看 DOI / 原文链接</a>':'')+'<div>'+p.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></article>').join(''):'<div class="card">还没有公开文献条目。上传下一篇论文到本对话后，我会为它建立可检索的记录。</div>'}q.oninput=render;ys.onchange=render;document.querySelector('#save').onclick=()=>{let p={title:title.value.trim(),year:+y.value,journal:journal.value.trim(),authors:authors.value.trim(),doi:doi.value.trim(),summary:summary.value.trim(),tags:tags.value.split(',').map(s=>s.trim()).filter(Boolean)};if(!p.title||!p.year||!p.summary)return alert('请填写标题、年份和概述。');papers.unshift(p);localStorage.setItem('literature-papers',JSON.stringify(papers));add.close();render()};document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(papers,null,2)],{type:'application/json'}));a.download='literature-records.json';a.click()};render();</script></body></html>
