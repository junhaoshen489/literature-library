<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人科研文献库</title>
<style>
:root{--ink:#14213d;--muted:#667085;--line:#dce3ee;--bg:#f6f8fc;--card:#fff;--blue:#1c5fcb;--soft:#eaf2ff;--green:#147a57;--orange:#a85e00;--purple:#6951a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;line-height:1.6}.wrap{max-width:1160px;margin:auto;padding:32px 22px}h1{margin:0;font-size:2rem}h2{font-size:1.2rem;margin:.2rem 0 1rem}.intro,.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:24px}.privacy{max-width:310px;background:#ecfdf3;color:#126448;padding:10px 14px;border-radius:10px;font-size:.9rem}.controls{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:22px}input,select,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid var(--line)}input,select{background:#fff;color:var(--ink)}button{background:#fff;color:var(--ink);cursor:pointer}.layout{display:grid;grid-template-columns:270px 1fr;gap:20px}.panel,.paper{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.taxonomy{position:sticky;top:12px;height:max-content}.group{margin:15px 0}.group h3{font-size:.9rem;margin:0 0 7px;color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:.86rem;padding:5px 9px;border-radius:999px}.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}.summary{font-size:.92rem;color:var(--muted);margin:0 0 12px}.paper{margin-bottom:12px}.paper h2{font-size:1.08rem;margin:0 0 5px}.meta{font-size:.9rem;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.tag{font-size:.8rem;padding:3px 8px;border-radius:999px;background:var(--soft);color:#164e9c}.tag.mod{background:#fff2df;color:var(--orange)}.tag.mech{background:#f1edff;color:var(--purple)}a{color:var(--blue)}details{margin-top:12px}.network{margin-bottom:20px}.network svg{display:block;width:100%;height:auto;background:linear-gradient(135deg,#fbfdff,#f4f7ff);border-radius:10px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.empty{padding:22px;text-align:center;color:var(--muted)}footer{margin-top:28px;color:var(--muted);font-size:.88rem}@media(max-width:760px){.hero,.layout{display:block}.privacy{margin-top:12px}.controls{grid-template-columns:1fr}.taxonomy{position:static;margin-bottom:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div><h1>个人科研文献库</h1><p class="intro">以“材料体系 × 改性手段 × 作用机制”组织文献，便于发现不同研究之间的联系。</p></div>
<div class="privacy">公开：题名、年份、分类与研究概述<br>私有：PDF 全文</div>
</header>
<div class="controls"><input id="search" placeholder="检索标题、作者、材料、改性或机制"><select id="year"><option value="">全部年份</option></select></div>
<div class="layout">
<aside class="panel taxonomy"><h2>研究方向分类</h2><div id="taxonomy"></div><button id="reset" type="button">清除筛选</button></aside>
<main>
<section class="panel network"><h2>文献关联谱图</h2><p class="muted">点击左侧任一分类后，图中只保留该类全部论文；论文间共享的材料、改性或机制标签越多，连线越深、距离越近。</p><svg id="graph" viewBox="0 0 900 420" role="img" aria-label="文献与研究主题关联谱图"></svg><div class="legend"><span><i class="dot" style="background:#1c5fcb"></i>论文</span><span><i class="dot" style="background:#147a57"></i>材料体系</span><span><i class="dot" style="background:#a85e00"></i>改性手段</span><span><i class="dot" style="background:#6951a8"></i>机制主题</span></div></section>
<p id="count" class="summary"></p><section id="papers"></section>
</main>
</div>
<footer>公开目录：<a href="https://github.com/junhaoshen489/literature-library">literature-library</a> · PDF 全文仅保存在私有仓库。</footer>
</div>
<script>
const papers=[{
id:"aem-2019-ncm811-radial",year:2019,
title:"Radially Oriented Single-Crystal Primary Nanosheets Enable Ultrahigh Rate and Cycling Properties of LiNi0.8Co0.1Mn0.1O2 Cathode Material for Lithium-Ion Batteries",
authors:"Xing Xu; Hua Huo; Jiyuan Jian; Liguang Wang; He Zhu; Sheng Xu; Xiaoshu He; Geping Yin; Chunyu Du; Xueliang Sun",
journal:"Advanced Energy Materials, 9, 1803963",doi:"10.1002/aenm.201803963",
summary:"本文提出由径向取向单晶纳米片构成的 NCM811 正极。该结构使活性 {010} 晶面有序外露，并形成由颗粒表面贯通中心的 Li+ 扩散通道；一致取向还可协调充放电体积变化，抑制晶界应力与微裂纹。材料在 5C 下实现 152.7 mAh g−1，1C 循环 300 圈保持 95.5% 容量。",
materials:["正极材料","NMC","NCM811","富镍层状氧化物"],
modifications:["调节颗粒形貌","一次颗粒取向","单晶纳米片"],
mechanisms:["Li+ 扩散","晶界应力","微裂纹","界面阻抗"],type:"研究型论文"},
{id:"ees-2021-reducing-cobalt-ev",year:2021,
title:"Reducing cobalt from lithium-ion batteries for the electric vehicle era",
authors:"Hoon-Hee Ryu; H. Hohyun Sun; Seung-Taek Myung; Chong S. Yoon; Yang-Kook Sun",
journal:"Energy & Environmental Science, 14, 844–852",doi:"10.1039/D0EE03581E",
summary:"本文以电动车应用为目标，比较无钴 NM、低钴高镍 NCM/NCA 与 LFP/LMFP 正极在成本、能量密度、寿命、快充与安全之间的权衡。作者认为未来将是多路线共存：高镍低钴材料适合高性能 EV，NM 面向部分成本敏感市场，LFP 适合安全和寿命优先场景。",
materials:["正极材料","NMC/NCM","NM","LFP","LMFP"],
modifications:["掺杂","包覆","调节颗粒形貌","微结构工程"],
mechanisms:["Co供应链与成本","高镍相变","晶界应力","微裂纹","Li+ 扩散","导电网络"],type:"综述"},
{id:"eem-2024-ni-rich-ml-design",year:2024,
title:"Ab Initio Design of Ni-Rich Cathode Material with Assistance of Machine Learning for High Energy Lithium-Ion Batteries",
authors:"Xinyu Zhang; Daobin Mu; Shijie Lu; Yuanxing Zhang; Yuxiang Zhang; Zhuolin Yang; Zhikun Zhao; Borong Wu; Feng Wu",
journal:"Energy & Environmental Materials, 7, e12744",doi:"10.1002/eem2.12744",
summary:"本文将热力学平衡、颗粒生长模型和 CFD 与少量 NCM811 前驱体共沉淀实验、数字形貌图和 PMD-LSTM 耦合，学习目标形貌与 pH、氨浓度、搅拌速度、反应时间之间的映射，再在 10 L 反应器反向设计前驱体并烧结验证。最佳小颗粒 NCM811 在 0.1C 为 206.1 mAh g−1、5C 为 151 mAh g−1，1C 循环 200 圈保持约 82–83%。",
materials:["正极材料","NMC","NCM811","富镍层状氧化物"],
modifications:["调节颗粒形貌","共沉淀工艺优化","机器学习辅助设计","反向设计"],
mechanisms:["成核与生长","Li+ 扩散","颗粒应力","流体混合"],type:"研究型论文"},
{id:"aem-2026-nmc-myths-perspective",year:2026,
title:"Debunking Common Myths & Misconceptions About NMC Positive Electrode Materials for Li-ion Batteries",
authors:"Matthew D. L. Garayt et al.; J. R. Dahn",
journal:"Advanced Energy Materials, 16, e70989",doi:"10.1002/aenm.70989",
summary:"本文系统检验四项围绕 NMC/NCA 的常见绝对化说法：Ni 含量与能量密度、LNO 式一级相变、LFP 与 NMC 全电池循环寿命、以及富锂富锰层状氧化物（LMR）的下一代定位。作者以同等容量/不同 UCV 的能量计算、operando XRD 两相共存判据与软包全电池数据说明，材料评价须共同考虑截止电压、平均电压、晶体/压实密度、负极配平、电解液、极化和寿命；高Ni、中Ni、LFP、LMR不存在脱离工作条件的绝对优劣。",
materials:["正极材料","NMC","高镍NMC","中镍NMC","NCA","LFP","富锂富锰层状氧化物(LMR)"],
modifications:[],mechanisms:["高压相变","H2-H3残余特征"],
topics:["能量密度","循环寿命","电压极化","电压窗口","全电池评价"],type:"综述",articleKind:"Perspective（观点文章）"}];
const taxonomy={types:{name:"文献类型",items:["综述","研究型论文","Perspective（观点文章）"]},materials:{name:"材料体系",items:["正极材料","NMC","NMC/NCM","NCM811","高镍NMC","中镍NMC","NCA","NM","LFP","LMFP","NMA","富镍层状氧化物","富锂富锰层状氧化物(LMR)"]},modifications:{name:"改性手段",items:["掺杂","包覆","调节颗粒形貌","一次颗粒取向","微结构工程","共沉淀工艺优化","机器学习辅助设计","反向设计"]},mechanisms:{name:"探索机制",items:["Co供应链与成本","高镍相变","高压相变","H2-H3残余特征","Li+ 扩散","晶界应力","微裂纹","界面阻抗","相变与结构演化","导电网络","成核与生长","颗粒应力","流体混合"]},evaluation:{name:"评价维度",items:["能量密度","循环寿命","电压极化","电压窗口","全电池评价"]}};
let filters=new Set();
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function allTags(p){return [p.type,p.articleKind,...p.materials,...p.modifications,...p.mechanisms,...(p.topics||[])].filter(Boolean)}
function renderTaxonomy(){const host=document.querySelector("#taxonomy");host.innerHTML=Object.entries(taxonomy).map(([key,g])=>'<div class="group"><h3>'+g.name+'</h3><div class="chips">'+g.items.map(item=>'<button class="chip '+(filters.has(item)?"active":"")+'" data-tag="'+esc(item)+'">'+esc(item)+'</button>').join("")+"</div></div>").join("");host.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{filters.has(b.dataset.tag)?filters.delete(b.dataset.tag):filters.add(b.dataset.tag);render()})}
function filtered(){const q=document.querySelector("#search").value.trim().toLowerCase(),y=document.querySelector("#year").value;return papers.filter(p=>(!y||String(p.year)===y)&&(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!filters.size||[...filters].every(tag=>allTags(p).includes(tag))))}
function renderPapers(rows){document.querySelector("#count").textContent="当前显示 "+rows.length+" 篇文献"+(filters.size?" · 已筛选："+[...filters].join("、"):"");document.querySelector("#papers").innerHTML=rows.length?rows.map(p=>'<article class="paper"><h2>'+esc(p.title)+'</h2><div class="meta">'+p.year+" · "+esc(p.journal)+"<br>"+esc(p.authors)+'</div><p>'+esc(p.summary)+'</p><a target="_blank" rel="noreferrer" href="https://doi.org/'+esc(p.doi)+'">查看 DOI</a><div class="tags"><span class="tag">'+esc(p.type)+'</span>'+(p.articleKind?'<span class="tag">'+esc(p.articleKind)+'</span>':"")+p.materials.map(x=>'<span class="tag">'+esc(x)+'</span>').join("")+p.modifications.map(x=>'<span class="tag mod">'+esc(x)+'</span>').join("")+p.mechanisms.map(x=>'<span class="tag mech">'+esc(x)+'</span>').join("")+(p.topics||[]).map(x=>'<span class="tag mech">'+esc(x)+'</span>').join("")+'</div><details><summary>归类依据</summary><p class="muted">类型：'+esc(p.type)+(p.articleKind?"（"+esc(p.articleKind)+"）":"")+"；材料："+esc(p.materials.join("、"))+"；改性："+esc(p.modifications.join("、"))+"；机制："+esc(p.mechanisms.join("、"))+"；评价："+esc((p.topics||[]).join("、"))+'</p></details></article>').join(""):'<div class="panel empty">没有匹配的文献。可清除筛选或更换关键词。</div>'}
function drawGraph(rows){
 const svg=document.querySelector("#graph"),w=900,h=420;
 const selected=[...filters];
 const similarity=(a,b)=>{
   const A=new Set(allTags(a).filter(t=>!selected.includes(t))),B=new Set(allTags(b).filter(t=>!selected.includes(t)));
   const shared=[...A].filter(t=>B.has(t));const union=new Set([...A,...B]);
   return {score:union.size?shared.length/union.size:0,shared};
 };
 if(!rows.length){svg.innerHTML='<text x="450" y="210" text-anchor="middle" fill="#667085" font-size="15">没有可绘制的文献</text>';return}
 if(rows.length===1){const p=rows[0];svg.innerHTML='<title>文献关联谱图</title><desc>当前筛选仅有一篇文献，累积更多同类论文后将显示论文之间的关联距离。</desc><circle cx="450" cy="210" r="18" fill="#1c5fcb"/><text x="450" y="250" text-anchor="middle" fill="#14213d" font-size="14">'+esc(p.title.length>56?p.title.slice(0,56)+"…":p.title)+'</text><text x="450" y="278" text-anchor="middle" fill="#667085" font-size="13">当前筛选仅有 1 篇文献；继续归档同类论文后将显示距离与连线。</text>';return}
 const nodes=rows.map((p,i)=>({p,x:170+(i%4)*190,y:110+Math.floor(i/4)*145,vx:0,vy:0}));
 const links=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const s=similarity(nodes[i].p,nodes[j].p);if(s.score>0)links.push({a:nodes[i],b:nodes[j],...s})}
 for(let step=0;step<180;step++){
   for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),f=4200/(d*d);a.vx-=f*dx/d;a.vy-=f*dy/d;b.vx+=f*dx/d;b.vy+=f*dy/d}
   links.forEach(l=>{let dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.max(1,Math.hypot(dx,dy)),target=330-190*l.score,f=(d-target)*0.018;l.a.vx+=f*dx/d;l.a.vy+=f*dy/d;l.b.vx-=f*dx/d;l.b.vy-=f*dy/d});
   nodes.forEach(n=>{n.vx*=.72;n.vy*=.72;n.x=Math.max(55,Math.min(w-55,n.x+n.vx));n.y=Math.max(55,Math.min(h-55,n.y+n.vy))})
 }
 const label=p=>p.title.length>30?p.title.slice(0,30)+"…":p.title;
 svg.innerHTML='<title>同类文献关联谱图</title><desc>节点代表当前分类中的论文；共同材料、改性或机制标签越多的论文，连线越深且距离越近。</desc>'+
 links.map(l=>'<line x1="'+l.a.x+'" y1="'+l.a.y+'" x2="'+l.b.x+'" y2="'+l.b.y+'" stroke="#7aa3e8" stroke-opacity="'+(.25+.7*l.score)+'" stroke-width="'+(1+4*l.score)+'"><title>关联度 '+Math.round(l.score*100)+'%；共同标签：'+esc(l.shared.join("、"))+'</title></line>').join("")+
 nodes.map(n=>'<g><circle cx="'+n.x+'" cy="'+n.y+'" r="13" fill="#1c5fcb"><title>'+esc(n.p.title)+'</title></circle><text x="'+(n.x+18)+'" y="'+(n.y+4)+'" fill="#14213d" font-size="12">'+esc(label(n.p))+'</text></g>').join("")+
 '<text x="22" y="28" fill="#667085" font-size="13">连线强度与节点距离由共同材料、改性手段和机制标签的 Jaccard 关联度计算</text>';
}function render(){const rows=filtered();renderTaxonomy();renderPapers(rows);drawGraph(rows)}
const ySel=document.querySelector("#year");[...new Set(papers.map(p=>p.year))].sort((a,b)=>b-a).forEach(y=>ySel.insertAdjacentHTML("beforeend",'<option value="'+y+'">'+y+"</option>"));document.querySelector("#search").oninput=render;ySel.onchange=render;document.querySelector("#reset").onclick=()=>{filters.clear();document.querySelector("#search").value="";ySel.value="";render()};render();
</script>
</body></html>
